name: Backend CI

on:
  push:
    paths:
      - "alfred_backend/**"
  pull_request:
    paths:
      - "alfred_backend/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r alfred_backend/requirements.txt

      - name: Run tests
        run: pytest alfred_backend/tests
